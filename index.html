<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC ROLEPLAY | القوانين المتطورة</title>
    <style>
        :root {
            --red: #ff0000;
            --bg: #0d0d0d;
            --card: #1a1a1a;
            --accent: #252525;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none; /* منع النسخ */
        }

        .header {
            background: black;
            padding: 15px 5%;
            border-bottom: 3px solid var(--red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { color: var(--red); font-weight: bold; font-size: 22px; letter-spacing: 2px; }

        /* شريط البحث */
        .search-container {
            text-align: center;
            padding: 20px;
        }
        #searchBox {
            width: 80%;
            max-width: 400px;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid var(--red);
            background: var(--card);
            color: white;
            outline: none;
        }

        .image-container { text-align: center; margin: 20px 0; }
        .hero-image { max-width: 300px; filter: drop-shadow(0 0 10px var(--red)); }

        .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .tab {
            background: var(--card);
            border: 1px solid #333;
            color: white;
            padding: 12px 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            border-radius: 4px;
        }
        .tab.active { background: var(--red); border-color: var(--red); color: white; }

        .grid {
            display: none;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
            animation: fadeIn 0.5s ease;
        }
        .grid.active { display: grid; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card);
            border-right: 4px solid var(--red);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .card:hover { background: var(--accent); transform: scale(1.02); }

        .tag { background: rgba(255,0,0,0.1); border: 1px solid var(--red); color: var(--red); padding: 4px 10px; font-size: 11px; border-radius: 3px; }

        /* نموذج الشكاوى */
        .report-section {
            background: var(--card);
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .report-section input, .report-section textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #000;
            border: 1px solid #444;
            color: white;
            box-sizing: border-box;
        }
        .report-btn {
            background: var(--red);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }

        #wrapper { transition: filter 0.3s; }
    </style>
</head>
<body oncontextmenu="return false;"> <div class="header">
    <div class="logo">WC ROLEPLAY</div>
    <div id="status" style="font-size: 12px; color: #888;">نظام القوانين المطور</div>
</div>

<div id="wrapper">
    <div class="image-container">
        <img src="input_file_0.png" class="hero-image">
    </div>

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="ابحث عن قانون معين..." onkeyup="filterRules()">
    </div>

    <div class="tabs">
        <button class="tab active" onclick="openTab('general')">القوانين</button>
        <button class="tab" onclick="openTab('report')">تقديم شكوى</button>
    </div>

    <div id="general" class="grid active">
        <div class="card rule"><span>1 - استخدام الثغرات</span><span class="tag">Warn 1</span></div>
        <div class="card rule"><span>2 - عدم الخوف على حياتك</span><span class="tag">Warn</span></div>
        <div class="card rule"><span>3 - (VDM) الصدم العشوائي</span><span class="tag">Warn 2</span></div>
        <div class="card rule"><span>4 - (RDM) القتل العشوائي</span><span class="tag">Warn 2</span></div>
        <div class="card rule"><span>6 - القذف والشتم</span><span class="tag">Banned Perm</span></div>
        </div>

    <div id="report" class="grid">
        <div class="report-section">
            <h3>تقديم بلاغ إداري</h3>
            <input type="text" id="reporterName" placeholder="اسمك في السيرفر">
            <input type="text" id="reportedName" placeholder="اسم المشتكى عليه">
            <textarea id="reason" rows="4" placeholder="تفاصيل المخالفة..."></textarea>
            <button class="report-btn" onclick="sendReport()">إرسال البلاغ إلى الديسكورد</button>
        </div>
    </div>
</div>

<script>
    // نظام البحث الفوري
    function filterRules() {
        let input = document.getElementById('searchBox').value.toLowerCase();
        let cards = document.getElementsByClassName('rule');
        
        for (let card of cards) {
            let text = card.textContent.toLowerCase();
            card.style.display = text.includes(input) ? "flex" : "none";
        }
    }

    function openTab(tabId) {
        document.querySelectorAll('.grid').forEach(g => g.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // نظام إرسال الشكاوى لقناة الديسكورد
    async function sendReport() {
        const webhookURL = "ضغ_هنا_رابط_الويبهوك_الخاص_بالقناة"; 
        const name = document.getElementById('reporterName').value;
        const target = document.getElementById('reportedName').value;
        const msg = document.getElementById('reason').value;

        if(!name || !target || !msg) return alert("يرجى ملء جميع الحقول");

        const payload = {
            embeds: [{
                title: "🚨 بلاغ جديد - WC RP",
                color: 16711680,
                fields: [
                    { name: "من:", value: name, inline: true },
                    { name: "ضد:", value: target, inline: true },
                    { name: "السبب:", value: msg }
                ],
                footer: { text: "آيدي القناة: 1434886047480942756" }
            }]
        };

        try {
            await fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            alert("تم إرسال البلاغ بنجاح!");
            document.getElementById('reason').value = "";
        } catch (e) {
            alert("حدث خطأ في الإرسال");
        }
    }

    // حماية الخصوصية عند الخروج من التبويب
    window.onblur = () => document.getElementById('wrapper').style.filter = 'blur(40px)';
    window.onfocus = () => document.getElementById('wrapper').style.filter = 'blur(0px)';
</script>

</body>
</html>
